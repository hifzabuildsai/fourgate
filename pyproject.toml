[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fourgate"
dynamic = ["version"]
description = "Independent outcome verification for consequential AI-agent actions"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Hifza Zafar"}]
keywords = ["mcp", "ai-agents", "verification"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/hifzabuildsai/fourgate"
Source = "https://github.com/hifzabuildsai/fourgate"
Issues = "https://github.com/hifzabuildsai/fourgate/issues"

[project.scripts]
fourgate = "fourgate.cli:main"

[tool.setuptools]
packages = ["fourgate", "fourgate.demo", "wrap"]

[tool.setuptools.dynamic]
version = {attr = "fourgate.__version__"}

[project.optional-dependencies]
# The legacy MCP test fixture imports eval_type_backport from Pydantic's
# internals; Pydantic 2.14 removed it. Keep this constraint dev-only.
dev = ["pytest", "mcp==1.9.4", "pydantic<2.14"]

[tool.pytest.ini_options]
testpaths = ["tests"]
