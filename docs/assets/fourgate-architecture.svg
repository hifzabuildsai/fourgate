<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="818" viewBox="0 0 1200 818" role="img" aria-labelledby="title description">
  <title id="title">Fourgate runtime processes and verification boundary</title>
  <desc id="description">The agent, guard, wrapped stdio MCP server, HTTP verifier subprocess, and local outcome files run on the operator machine or CI runner. The MCP server owns writes to the external provider API. The guard correlates tool requests with results and, after a contracted success result, sends only selected fields to the HTTP verifier. The verifier independently reads authoritative state with HTTPS GET. The guard accepts typed PASS or FAIL replies and maps verifier faults or uncertainty to UNKNOWN, applies shadow or enforce response policy, and writes structural outcome metadata. A configured outcomes.jsonl file feeds the local HTML summary. Listed verifier secret environment variables are withheld from the wrapped MCP server.</desc>
  <!-- Runtime-only view: fourgate guard, without the legacy baseline classifier.
       Dark palette matches Fourgate; this is a static process and data-flow diagram.
       The guard owns UNKNOWN normalization, response policy, and outcome logging. -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#a1a1a1"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="1198" height="816" rx="20" fill="#000000" stroke="#262626" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="32" y="46" fill="#ededed" font-size="27" font-weight="600">Fourgate runtime architecture</text>
    <text x="32" y="78" fill="#a1a1a1" font-size="19">Local stdio MCP · independent HTTP read-back · local evidence</text>
  </g>

  <rect x="24" y="106" width="855" height="668" rx="16" fill="#0a0a0a" stroke="#3d3d3d" stroke-width="1.5"/>
  <g font-family="monospace" font-size="17" fill="#a1a1a1">
    <text x="48" y="141">LOCAL MACHINE / CI RUNNER</text>
    <text x="947" y="141">EXTERNAL API</text>
  </g>

  <!-- Bidirectional MCP path: request forwarded; result evaluated before response. -->
  <g fill="none" stroke="#a1a1a1" stroke-width="1.8" marker-end="url(#arrow)">
    <path d="M224 228H308"/>
    <path d="M308 280H224"/>
    <path d="M562 228H650"/>
    <path d="M650 280H562"/>
    <path d="M860 228H952"/>
    <path d="M390 326V454"/>
    <path d="M480 454V326"/>
    <path d="M314 306H149V454"/>
    <path d="M149 604V660"/>
    <path d="M562 526H1067V400" stroke-dasharray="7 6" marker-start="url(#arrow)"/>
  </g>
  <g font-family="monospace" font-size="15" fill="#a1a1a1" text-anchor="middle">
    <text x="266" y="213">tools/call</text>
    <text x="266" y="265">per mode</text>
    <text x="606" y="213">stdio</text>
    <text x="606" y="265">result</text>
    <text x="906" y="213">write</text>
    <text x="373" y="387" text-anchor="end">selected fields</text>
    <text x="498" y="377" text-anchor="start">reply / fault</text>
    <text x="498" y="403" text-anchor="start">back to guard</text>
    <text x="168" y="405" text-anchor="start">metadata</text>
    <text x="168" y="638" text-anchor="start">summary CLI</text>
    <text x="824" y="506" font-size="17">HTTPS GET + read-back state</text>
  </g>

  <!-- Each card is a process or artifact, not a UI control. -->
  <g fill="#000000" stroke="#878787" stroke-width="1.5">
    <rect x="48" y="190" width="170" height="110" rx="12"/>
    <rect x="314" y="174" width="242" height="146" rx="12"/>
    <rect x="656" y="190" width="198" height="110" rx="12"/>
    <rect x="958" y="174" width="218" height="220" rx="12"/>
    <rect x="314" y="460" width="242" height="138" rx="12"/>
    <rect x="48" y="460" width="202" height="138" rx="12"/>
    <rect x="48" y="666" width="202" height="84" rx="12"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <g fill="#ededed" font-size="22" font-weight="600">
      <text x="133" y="234">Agent</text>
      <text x="435" y="207">fourgate guard</text>
      <text x="755" y="234">MCP server</text>
      <text x="1067" y="207">System of record</text>
      <text x="435" y="493">HTTP verifier</text>
      <text x="149" y="493">Outcome log</text>
      <text x="149" y="701" font-size="21">HTML summary</text>
    </g>
    <g fill="#a1a1a1" font-size="18">
      <text x="133" y="265">MCP client</text>
      <text x="435" y="235">correlate request + result</text>
      <text x="435" y="261">contract + response policy</text>
      <text x="755" y="265">owns the write</text>
      <text x="1067" y="239">authoritative state</text>
      <text x="1067" y="292">Write: server credential</text>
      <text x="1067" y="322">Read: verifier credential</text>
      <text x="435" y="548">deterministic, no LLM</text>
      <text x="435" y="578" font-size="16">verifier budget ≤ 2000 ms</text>
      <text x="149" y="548">structural metadata only</text>
    </g>
  </g>
  <g font-family="monospace" font-size="16" fill="#a1a1a1" text-anchor="middle">
    <text x="435" y="521">fourgate.verify_http</text>
    <text x="149" y="521">outcomes.jsonl</text>
    <text x="149" y="729">fourgate summary</text>
  </g>
  <g font-family="monospace" font-size="16">
    <text x="340" y="294" fill="#3fcf7f">PASS</text>
    <text x="387" y="294" fill="#a1a1a1">/</text>
    <text x="404" y="294" fill="#ff6166">FAIL</text>
    <text x="450" y="294" fill="#a1a1a1">/</text>
    <text x="467" y="294" fill="#f5a524">UNKNOWN</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" fill="#a1a1a1" font-size="18">
    <text x="314" y="652" fill="#ededed" font-weight="600">Verification boundary</text>
    <text x="314" y="684">Human-approved contracts select fields and read-back rules.</text>
    <text x="314" y="712">Listed read secret env vars are withheld from the MCP server.</text>
    <text x="314" y="740">No hosted Fourgate service. No rollback or write retry.</text>
    <text x="32" y="805" font-size="17">Shadow preserves the response. Enforce adds a verdict only on FAIL. UNKNOWN fails open; never PASS.</text>
  </g>
</svg>
