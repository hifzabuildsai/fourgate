name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: python -m pip install ".[dev]"

      - name: Run full test suite
        run: python -m pytest -q

      - name: Run Outcome Guard demo
        run: python demo_outcome.py

      - name: Check installed scan CLI
        run: fourgate --help

      - name: Check installed guard CLI
        run: fourgate guard --help

      - name: Check installed doctor CLI
        run: fourgate doctor --help

      - name: Check installed init CLI
        run: fourgate init --help

      - name: Doctor preflight on the demo fixture
        run: fourgate doctor --contracts fixtures/contracts/outcome_demo.json -- python fixtures/outcome_server.py

      - name: Run the product demo
        run: fourgate demo --out demo-output

      - name: Check the demo summary page
        run: python -c "import pathlib, sys; p = pathlib.Path('demo-output/fourgate-demo-summary.html'); sys.exit(0 if p.is_file() else 'missing ' + str(p))"

      - name: Run runtime self-check
        run: python wrap/wrap.py --selfcheck

  package:
    # Builds the wheel and sdist, then installs the wheel into a fresh venv
    # outside the checkout so nothing is imported from the source tree.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: |
          python -m pip install build
          python -m build

      - name: Check wheel contents
        run: |
          python - <<'EOF'
          import pathlib, zipfile
          wheels = list(pathlib.Path("dist").glob("fourgate-*.whl"))
          assert len(wheels) == 1, wheels
          assert len(list(pathlib.Path("dist").glob("fourgate-*.tar.gz"))) == 1
          names = set(zipfile.ZipFile(wheels[0]).namelist())
          for required in ("fourgate/demo/server.py", "fourgate/demo/verifier.py"):
              assert required in names, f"{required} missing from {wheels[0].name}"
          print(f"{wheels[0].name}: {len(names)} files, demo server and verifier present")
          EOF

      - name: Install the wheel in a fresh venv and smoke-test
        run: |
          python - <<'EOF'
          import os, pathlib, subprocess, sys
          wheel = next(pathlib.Path("dist").glob("fourgate-*.whl")).resolve()
          tmp = pathlib.Path(os.environ["RUNNER_TEMP"]) / "fourgate-smoke"
          tmp.mkdir()
          subprocess.run([sys.executable, "-m", "venv", str(tmp / "venv")], check=True)
          scripts = tmp / "venv" / ("Scripts" if os.name == "nt" else "bin")
          exe = ".exe" if os.name == "nt" else ""
          python, fourgate = str(scripts / f"python{exe}"), str(scripts / f"fourgate{exe}")
          # The venv comes first on PATH, so "python" below is the venv's interpreter.
          env = {**os.environ, "PATH": str(scripts) + os.pathsep + os.environ["PATH"],
                 "FOURGATE_SMOKE_READ_TOKEN": "smoke-token-not-a-secret"}

          def run(*argv, **kwargs):
              print("+", " ".join(argv), flush=True)
              return subprocess.run(argv, cwd=tmp, env=env, stdin=subprocess.DEVNULL, check=True, **kwargs)

          run(python, "-m", "pip", "install", str(wheel))
          out = run(fourgate, "--version", capture_output=True, text=True).stdout
          print(out, end="")
          version = wheel.name.split("-")[1]
          assert out.splitlines() == [f"fourgate {version}"], out
          run(fourgate, "demo", "--out", str(tmp / "d"))
          assert (tmp / "d" / "fourgate-demo-summary.html").is_file()
          run(fourgate, "init", "--tool", "create_issue", "--test-account", "disposable-demo",
              "--id-path", "result.structuredContent.issue_id",
              "--readback-url", "https://api.example.test/issues/{record_id}",
              "--expect", "title=title", "--arg", "title=FOURGATE-SCAN-TEST",
              "--token-env", "FOURGATE_SMOKE_READ_TOKEN", "--dir", str(tmp / "c"),
              "--", "python", "-m", "fourgate.demo.server")
          run(fourgate, "doctor", "--contracts", str(tmp / "c" / "runtime.json"), "--log", str(tmp / "o.jsonl"),
              "--", "python", "-m", "fourgate.demo.server")
          EOF

      - name: Upload dist
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: fourgate-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  ci-scan-template:
    # Runs the steps of examples/ci/fourgate-scan.yml against the bundled demo
    # fixture. Installs from this checkout instead of a tag so the template is
    # checked against the code under review.
    runs-on: ubuntu-latest
    env:
      FOURGATE_CONTRACT: fixtures/contracts/scan_demo.json
      FOURGATE_TEST_ACCOUNT: disposable-demo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Fourgate
        run: python -m pip install .

      - name: Broken fixture scan must exit 1
        env:
          FOURGATE_DEMO_MODE: broken
          FOURGATE_REPORT_DIR: fourgate-output/broken
        run: |
          export FOURGATE_DEMO_STORE="$RUNNER_TEMP/broken-issues.json"
          set +e
          fourgate scan "$FOURGATE_CONTRACT" \
            --confirm-test-account "$FOURGATE_TEST_ACCOUNT" \
            --report-dir "$FOURGATE_REPORT_DIR" > /dev/null
          code=$?
          set -e
          echo "exit code: $code"
          test "$code" -eq 1
          test -f "$FOURGATE_REPORT_DIR/fourgate-report.json"
          test -f "$FOURGATE_REPORT_DIR/fourgate-report.html"

      - name: Healthy fixture scan must exit 0
        env:
          FOURGATE_DEMO_MODE: healthy
          FOURGATE_REPORT_DIR: fourgate-output/healthy
        run: |
          export FOURGATE_DEMO_STORE="$RUNNER_TEMP/healthy-issues.json"
          fourgate scan "$FOURGATE_CONTRACT" \
            --confirm-test-account "$FOURGATE_TEST_ACCOUNT" \
            --report-dir "$FOURGATE_REPORT_DIR" > /dev/null
          test -f "$FOURGATE_REPORT_DIR/fourgate-report.json"

      - name: Summarize verdicts
        run: |
          for mode in broken healthy; do
            FOURGATE_REPORT_DIR="fourgate-output/$mode" python - <<'EOF'
          import json, os, pathlib
          path = pathlib.Path(os.environ["FOURGATE_REPORT_DIR"], "fourgate-report.json")
          if not path.exists():
              raise SystemExit("no Fourgate report was written")
          for row in json.loads(path.read_text(encoding="utf-8"))["cases"]:
              print(f"{row['tool']}: {row['status']} / {row.get('reason_code')}")
          EOF
          done

      - name: Upload Fourgate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fourgate-reports-ci-template
          path: fourgate-output
          if-no-files-found: error
          retention-days: 7
