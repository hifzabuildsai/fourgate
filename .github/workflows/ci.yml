name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run full test suite
        run: python -m pytest -q

      - name: Run Outcome Guard demo
        run: python demo_outcome.py

      - name: Run runtime self-check
        run: python wrap/wrap.py --selfcheck
