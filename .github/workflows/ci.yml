name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install ".[dev]"

      - name: Run full test suite
        run: python -m pytest -q

      - name: Run Outcome Guard demo
        run: python demo_outcome.py

      - name: Check installed scan CLI
        run: fourgate --help

      - name: Run runtime self-check
        run: python wrap/wrap.py --selfcheck
